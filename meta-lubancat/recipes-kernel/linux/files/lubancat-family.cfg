# LubanCat 六族通用内核配置兜底片段（rk3528 / rk3562 / rk3566 / rk3568 / rk3576 / rk3588）
#
# 定位：不是完整 defconfig（完整配置由 lubancat_linux_<soc>_defconfig 提供），
# 只写「缺了就起不来 / 起得来但看不到、连不上 / dtbo 挂不上」的项，方便 review 与回归。
# 六族共用一份：这里列的都是 rockchip 公共代码里的符号，不存在按族分叉。
#
# 注意：整份替换 SRC_URI 之后，上游 recipe 里的 cgroups.cfg / ext4.cfg 也一起没了，
# 所以这里要把 ext4 相关项补回来（IMAGE_FSTYPES 含 ext4）。
#
# 另一个写法上的坑：关掉某项必须写 CONFIG_X=n，不能写 "# CONFIG_X is not set"。
# merge_config.sh 会把以 # 开头的行当注释整行删掉，于是"关掉"根本没生效；
# 而 CONFIG_X=n 会被它自动转成 "# CONFIG_X is not set"。

# ---- 设备树 overlay 的前提：dtb 里带 __symbols__（dtc -@）----
# Rockchip 用私有符号 CONFIG_DTC_SYMBOLS 控制 DTC_FLAGS += -@；
# 没有 __symbols__ 时 fdt_overlay_apply 会报 "FDT_ERR_NOTFOUND"。
CONFIG_DTC_SYMBOLS=y

# ---- 串口控制台：fiq-debugger 接管 UART2，内核里呈现为 ttyFIQ0 ----
CONFIG_FIQ_DEBUGGER=y
CONFIG_FIQ_DEBUGGER_CONSOLE=y
CONFIG_FIQ_DEBUGGER_CONSOLE_DEFAULT_ENABLE=y

# ---- 以太网：GMAC1(fe1c0000) + RTL8211F，NFS root 需要内建 ----
CONFIG_STMMAC_ETH=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_REALTEK_PHY=y
CONFIG_NFS_FS=y
CONFIG_ROOT_NFS=y
CONFIG_IP_PNP=y
CONFIG_IP_PNP_DHCP=y

# ---- 存储：eMMC(sdhci) + TF(sdmmc) ----
CONFIG_MMC_SDHCI_OF_DWCMSHC=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_MMC_BLOCK_MINORS=32

# ---- 文件系统（替代上游 ext4.cfg）----
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_EXT4_USE_FOR_EXT2=y

# ---- 电源：RK806 + RK860X（CPU/NPU 供电）----
CONFIG_MFD_RK806=y
CONFIG_REGULATOR_RK806=y
CONFIG_REGULATOR_RK860X=y

# ---- 调试友好 ----
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PROC_FS=y
CONFIG_SYSVIPC=y

# ---- 无线网卡：按总线分成两条路线，别混 ----
#   SDIO / USB 模组 → Rockchip vendor 树（drivers/net/wireless/rockchip_wlan），
#                    固件在 meta-rockchip 的 rkwifibt-firmware 里
#   PCIe（M.2）模组 → 内核主线驱动（rtlwifi / rtw88 / rtw89），
#                    固件在 linux-firmware 里
#
# ① vendor 树里的 SDIO / USB 驱动
#   这两个驱动曾经报 "drv_types.h: No such file or directory"，根因是 Makefile 里
#   的 -I$(src)/include 在 O=${B} 的 out-of-tree 构建下指向不存在的目录，
#   已由 0002-wifi-out-of-tree-paths.patch 修掉。
#   顺带把 WL_ROCKCHIP 锁成 y：它 select CFG80211 / MAC80211，而主线 rtw88/rtw89
#   是 depends on MAC80211 的，缺了这一层 rtw89 会被 olddefconfig 静默清掉。
CONFIG_WL_ROCKCHIP=y
CONFIG_RTL8189FS=m
CONFIG_RTL8821CU=m
# ② vendor 树里的 8851be / 8852be 是 PCIe 版，和主线 rtw89 抢同一个 PCI ID，
#   只能二选一。默认走主线（固件命名和 linux-firmware 一致，不用另找 Rockchip 的
#   Android 风格固件）。要用 vendor 版（例如需要 AP 模式）就把这两行改成 =m、
#   同时把下面 RTW89_8851BE / RTW89_8852BE 关掉，再按驱动要求的
#   <FW_FILE_CONFIG_PATH>/rtl8852b/RTL8852Bfw.bin 放固件。
CONFIG_RTL8851BE=n
CONFIG_RTL8852BE=n
# ③ 主线 PCIe 驱动：RTL8188CE / RTL8822CE / RTL8851BE / RTL8852BE
#   rtw88 / rtw89 是 menuconfig，子驱动在 if RTW88/if RTW89 里面，两层都得开。
CONFIG_RTL8188EE=m
CONFIG_RTW88=m
CONFIG_RTW88_8822CE=m
CONFIG_RTW89=m
CONFIG_RTW89_8851BE=m
CONFIG_RTW89_8852BE=m

# 若遇到 gcc 13 下 BSP 内核的告警变错误，先解注释这一行再定位：
# CONFIG_WERROR is not set

#@TYPE: Machine
#@NAME: LubanCat RK3588 / RK3588S family
#@DESCRIPTION: 族级 machine：一份镜像覆盖 LubanCat-4 / 4IO / 5 / 5-V2 / 5IO / 5IOB / 5IOF / 5IOI / 5IO-AIBOX1（RK3588 与 RK3588S）。boot 分区内放全族 dtb，运行时用 /rk-kernel.dtb 或 uEnv.txt 选板。

require conf/machine/include/lubancat-rk3588.inc

# 注意：不要加 vfat。MACHINE_FEATURES 里的 vfat 会让 poky 往 KERNEL_FEATURES 里
# 追加 cfg/fs/vfat.scc，而 linux-rockchip 不是 linux-yocto，没有那份 kernel-cache
# 元数据，do_kernel_metadata 会找不到 scc 而失败。根文件系统是 ext4。
MACHINE_FEATURES = "usbhost usbgadget alsa screen ext2"

# 只影响 boot.img 的默认 dtb 与 KERNEL_IMAGETYPE_FOR_MAKE（即 %.img 规则）。
# extboot 下真正生效的是 boot 分区里的 /rk-kernel.dtb —— 见 extboot-image.bb。
KERNEL_DEVICETREE = "rockchip/rk3588-lubancat-generic.dtb"

# 族内全量 dtb 与 dtbo 都进 boot 分区（39 块板跨族，单族约 12 个 dtb / 280 个 dtbo）
# 族镜像默认用 generic dtb 启动：它在本族所有板子上都能起（U-Boot 早期阶段也用这一份，
# 所以 eMMC/串口必须够用）。首次启动由 lubancat-board-detect 读 SARADC 板卡 ID，
# 把 /rk-kernel.dtb 换成对应板子的那份，再重启一次。
LUBANCAT_FIRSTBOOT_SWITCH ?= "1"

LUBANCAT_FAMILY_ALL_DTBS ?= "1"

# **不能用** lubancat-5-rk3588-pcie_defconfig：它显式写了
#   # CONFIG_ROCKCHIP_EARLY_DISTRO_DTB is not set
# 会让 extboot 的「U-Boot 早期 dtb 从介质取」失效，退回编译期内置 dtb。
UBOOT_MACHINE = "rk3588_defconfig"

# 默认板型（族镜像出厂时 rk-kernel.dtb 指向它）；板级 machine 会覆盖。
LUBANCAT_DTB ?= "rk3588-lubancat-generic.dtb"
LUBANCAT_UENV ?= "uEnvLubanCat.txt"

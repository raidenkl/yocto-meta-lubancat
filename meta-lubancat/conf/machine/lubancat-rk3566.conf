#@TYPE: Machine
#@NAME: LubanCat RK3566 family
#@DESCRIPTION: 族级 machine：覆盖 LubanCat-1 / 1H / 1IO / 1N / 0 / CM4（RK3566）。U-Boot 走 rk3568_defconfig + configs/rk3566.config。

require conf/machine/include/lubancat-rk3566.inc

MACHINE_FEATURES = "usbhost usbgadget alsa screen ext2"

KERNEL_DEVICETREE = "rockchip/rk356x-lubancat-generic.dtb"
# 族镜像默认用 generic dtb 启动：它在本族所有板子上都能起（U-Boot 早期阶段也用这一份，
# 所以 eMMC/串口必须够用）。首次启动由 lubancat-board-detect 读 SARADC 板卡 ID，
# 把 /rk-kernel.dtb 换成对应板子的那份，再重启一次。
LUBANCAT_FIRSTBOOT_SWITCH ?= "1"

LUBANCAT_FAMILY_ALL_DTBS ?= "1"

# 该树没有 rk3566_defconfig；官方组合是 rk3568_defconfig + rk3566.config 片段。
UBOOT_MACHINE = "rk3568_defconfig"

LUBANCAT_DTB ?= "rk356x-lubancat-generic.dtb"
LUBANCAT_UENV ?= "uEnvLubanCat.txt"

#@TYPE: Machine
#@NAME: LubanCat RK3576 family
#@DESCRIPTION: 族级 machine：覆盖 LubanCat-3 / 3-V2 / 3IO / 3IO-test（RK3576）。boot 分区放全族 dtb，运行时选 rk-kernel.dtb。

require conf/machine/include/lubancat-rk3576.inc

MACHINE_FEATURES = "usbhost usbgadget alsa screen ext2"

KERNEL_DEVICETREE = "rockchip/rk3576-lubancat-generic.dtb"
# 族镜像默认用 generic dtb 启动：它在本族所有板子上都能起（U-Boot 早期阶段也用这一份，
# 所以 eMMC/串口必须够用）。首次启动由 lubancat-board-detect 读 SARADC 板卡 ID，
# 把 /rk-kernel.dtb 换成对应板子的那份，再重启一次。
LUBANCAT_FIRSTBOOT_SWITCH ?= "1"

LUBANCAT_FAMILY_ALL_DTBS ?= "1"

UBOOT_MACHINE = "rk3576_defconfig"

LUBANCAT_DTB ?= "rk3576-lubancat-generic.dtb"
LUBANCAT_UENV ?= "uEnvLubanCat.txt"

#@TYPE: Machine
#@NAME: LubanCat-4 V1
#@DESCRIPTION: EmbedFire LubanCat-4 V1 (EBF410116 V1.2), RK3588S, 8GB LPDDR4X, eMMC + TF, GMAC1 + RTL8211F

require conf/machine/include/lubancat-rk3588.inc

# 注意：不要加 vfat。MACHINE_FEATURES 里的 vfat 会让 poky 往 KERNEL_FEATURES 里
# 追加 cfg/fs/vfat.scc，而 linux-rockchip 不是 linux-yocto，没有那份 kernel-cache 元数据，
# do_kernel_metadata 会找不到 scc 而失败。根文件系统是 ext4，用不到 vfat。
MACHINE_FEATURES = "usbhost usbgadget alsa screen ext2"

# 路线 A（推荐先用它跑通）：内核树自带的板级 dts，路径前缀必须是 rockchip/。
# linux-rockchip.inc 会把这份 dts 推导成 KERNEL_IMAGETYPE_FOR_MAKE=<name>.img，
# 由 Rockchip 内核的 .img 规则打包出 boot.img（kernel + dtb），wic 的 boot 分区靠它。
KERNEL_DEVICETREE = "rockchip/rk3588s-lubancat-4-v1.dtb"

# 路线 B：改用本工作区验证过的 millennium-4 设备树时，把那颗 dts 打进内核树并
# 注册到 Makefile 后，只改这一行即可（详细步骤见手册第 7 章）：
# KERNEL_DEVICETREE = "rockchip/rk3588s-millennium-4.dtb"

# LubanCat/u-boot main 里 `ls configs | grep rk3588` 的结果以实查为准；
# rk3588_defconfig 已确认存在，且已带 CONFIG_BAUDRATE=1500000 / DEBUG_UART_BASE=0xFEB50000。
UBOOT_MACHINE = "rk3588_defconfig"

# 个别批次若把调试口改到 115200，只在本文件覆盖，不要动 include：
# SERIAL_CONSOLES = "115200;ttyFIQ0"

# ---- extboot：本板在 boot 分区里的默认 dtb 与 uEnv 模板 ----
# 换成本板 = cp /boot分区/dtb/rk3588s-lubancat-4.dtb /boot分区/rk-kernel.dtb
LUBANCAT_DTB = "rk3588s-lubancat-4-v1.dtb"
LUBANCAT_UENV_DIR = "rk3588"
LUBANCAT_UENV = "uEnvLubanCat4-V1.txt"

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lubancat"
BBFILE_PATTERN_lubancat = "^${LAYERDIR}/"
BBFILE_PRIORITY_lubancat = "10"

# 与 git tag 的 MAJOR.MINOR 保持一致（v0.1.x → "0.1"）
LAYERVERSION_lubancat = "0.1"

# 只依赖真正必需的层。meta-arm / meta-openembedded 是可选能力（GPU、Python 包、
# 网络工具），装上了也不会因为这里没列而报错；反过来列了却没装，会直接 parse error。
LAYERDEPENDS_lubancat = "core rockchip"

LAYERSERIES_COMPAT_lubancat = "scarthgap"

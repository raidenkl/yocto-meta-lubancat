# meta-lubancat: 无线凭据（wlan0 专用，由 wpa_supplicant@wlan0.service 读取）
#
# 这个文件是模板，出厂不带任何可用配置 —— 没有 network={} 段时 wpa_supplicant
# 会正常起进程、扫描、但不连接任何 AP。
#
# 两种填法：
#
# 1) 直接写明文密码（调试方便）
#
#      network={
#          ssid="你的SSID"
#          psk="你的密码"
#      }
#
# 2) 写 psk 派生值（推荐，文件里不留明文密码）
#
#      wpa_passphrase "你的SSID" "你的密码" >> /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
#
# 改完生效：
#
#      systemctl restart wpa_supplicant@wlan0
#      ip -4 addr show wlan0          # 等几秒，应该拿到 DHCP 地址
#      ip route show default          # 应有 default via <AP网关> dev wlan0 metric 100
#
# ★ 只写 ssid、不写 psk 就是错的（实测踩过）：
#   加密网络下 wpa_supplicant 会把这个 network 判为无效，日志里只有一句
#       wlan0: No enabled networks (1 disabled networks)
#   然后状态机停在 INACTIVE：`systemctl status` 显示 active、`iw dev wlan0 link`
#   显示 Not connected，看起来像"驱动/信号问题"，其实是配置不完整。
#   开放网络（无密码）才允许只写 ssid，那种情况建议显式加一行 key_mgmt=NONE。
#
# 企业级加密（WPA-Enterprise / 802.1X）需要在 network{} 里补 key_mgmt=WPA-EAP
# 和 eap/identity/password 等字段，不在本模板覆盖范围内。
#
# 本文件权限是 0600，放在 /etc 下属于配置文件（CONFFILES），升级镜像不会被覆盖。
#
# 注意：不要再手工跑 `udhcpc -i wlan0`。wlan0 现在由 systemd-networkd 做 DHCP，
# 两个 DHCP 客户端同时在线会互相抢地址。看一下状态：
#     networkctl status wlan0

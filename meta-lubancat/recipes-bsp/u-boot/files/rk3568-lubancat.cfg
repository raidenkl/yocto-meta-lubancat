# LubanCat RK3568 的 U-Boot 配置增量
CONFIG_DISTRO_DEFAULTS=y
CONFIG_CMD_PART=y
CONFIG_CMD_EXT2=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_CMD_IMPORTENV=y
CONFIG_CMD_SOURCE=y
CONFIG_CMD_BOOTI=y
CONFIG_CMD_FDT=y
CONFIG_CMD_DTIMG=y
CONFIG_OF_LIBFDT_OVERLAY=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB_PATH="rk-kernel.dtb"

# **必须覆盖**：rk3568_defconfig 里是 RK3566MINIALL.ini（内含 rk3566 的 DDR bin，
# 1056MHz 档），用在 rk3568 上表现为「一行都不打印的假死」。
CONFIG_LOADER_INI="RK3568MINIALL.ini"

# LubanCat RK3566 的 U-Boot 配置增量
#
# 主体走 UBOOT_MACHINE=rk3568_defconfig + 官方片段 configs/rk3566.config
# （该片段只含 CONFIG_BASE_DEFCONFIG 与 CONFIG_LOADER_INI 两行），
# 这里只补 extboot 能力并显式确认 loader ini。
CONFIG_DISTRO_DEFAULTS=y
CONFIG_CMD_PART=y
CONFIG_CMD_EXT2=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_CMD_IMPORTENV=y
CONFIG_CMD_SOURCE=y
CONFIG_CMD_BOOTI=y
CONFIG_CMD_FDT=y
CONFIG_CMD_DTIMG=y
CONFIG_OF_LIBFDT_OVERLAY=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB_PATH="rk-kernel.dtb"

# rk3566 无独立 spl/bl31/bl32：共用 rk356x_spl + rk3568_bl31/bl32，
# 且 RKTRUST/ 下没有 RK3566TRUST.ini（只有 RK3566TRUST_ULTRA.ini）。
CONFIG_LOADER_INI="RK3566MINIALL.ini"

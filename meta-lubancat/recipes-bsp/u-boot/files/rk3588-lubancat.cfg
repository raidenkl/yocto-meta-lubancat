# LubanCat-4 的 U-Boot 配置增量
#
# 前提：LubanCat/u-boot main 的 configs/rk3588_defconfig 已经包含
#   CONFIG_BAUDRATE=1500000
#   CONFIG_DEBUG_UART_BASE=0xFEB50000     （UART2）
#   CONFIG_SPL_FIT_IMAGE_KB=4096          （已大于曾翻车的 2048）
#   CONFIG_ROCKCHIP_FIT_IMAGE_PACK=y       （BL31 进 uboot.img，不产 trust.img）
#   CONFIG_ROCKCHIP_NEW_IDB=y              （idblock 落 sector 64）
# 所以下面默认全部注释，按需打开。**不要**无条件把 OF_U_BOOT_REMOVE_PROPS 置空：
# 那会让 U-Boot 的设备树变大，是 SPL FIT 体积问题的来源之一。

# ---- 什么时候必须打开这一段 ----
# 只有在 U-Boot 阶段就要用以太网（TFTP 拉内核、NFS 调试、tftp 更新固件）时才打开。
# 打开的原因：defconfig 里的 CONFIG_OF_U_BOOT_REMOVE_PROPS 会删掉
# pinctrl-0 / pinctrl-names / assigned-clocks 等属性，导致 gmac1 的
# clk_set_rate(125MHz) 找不到合适父时钟而返回 -EINVAL，probe 静默失败，
# 串口上一行日志都没有。
#
# CONFIG_OF_U_BOOT_REMOVE_PROPS=""
# CONFIG_USING_KERNEL_DTB is not set
# CONFIG_CMD_DHCP=y
# CONFIG_CMD_PING=y
# CONFIG_CMD_TFTPBOOT=y
# CONFIG_CMD_TFTP_BOOTM=y
# CONFIG_CMD_NFS=y
# CONFIG_NET_RANDOM_ETHADDR=y

# ---- 已知风险开关，保持默认，改动需实测 ----
# CONFIG_USING_KERNEL_DTB_V2=y   # U-Boot 运行时外设 dtb 来自介质上的内核 dtb
# CONFIG_SPL_FIT_IMAGE_KB=4096   # 若开 USING_KERNEL_DTB 后报 FIT 超限，加到 6144

# =====================================================================
# extboot（boot 分区 = ext2 + boot.scr + uEnv.txt + dtbo）所需的能力
# =====================================================================
# 这 11 项在 LubanCat/u-boot main 里其实**已经默认全开**：
#   DISTRO_DEFAULTS 在 ARCH_ROCKCHIP 下 default y，并 select
#   CMD_BOOTI / CMD_EXT2 / CMD_EXT4 / CMD_FS_GENERIC / CMD_PART；
#   CMD_DTIMG=y 又 select OF_LIBFDT_OVERLAY。
# 这里显式钉死，是为了防止换 defconfig（例如误用 lubancat-5-rk3588-pcie，
# 那份把 EARLY_DISTRO_DTB 关了）或上游改默认值后静默退化成「找不到 boot.scr」。
CONFIG_DISTRO_DEFAULTS=y
CONFIG_CMD_PART=y
CONFIG_CMD_EXT2=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_CMD_IMPORTENV=y
CONFIG_CMD_SOURCE=y
CONFIG_CMD_BOOTI=y
CONFIG_CMD_FDT=y
CONFIG_CMD_DTIMG=y
CONFIG_OF_LIBFDT_OVERLAY=y

# 早期 dtb 从 bootable 分区根目录的 rk-kernel.dtb 取（与内核用同一份文件）。
# 换 dtb = 换介质上的一个文件，U-Boot 与内核同时生效。
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB_PATH="rk-kernel.dtb"

# loader ini：rk3588 用 RK3588MINIALL.ini（DDR lp4 2112 / lp5 2400 v1.19）
CONFIG_LOADER_INI="RK3588MINIALL.ini"


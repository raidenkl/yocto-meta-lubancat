# LubanCat RK3576 的 U-Boot 配置增量
#
# extboot 所需能力（与 rk3588-lubancat.cfg 同一组，逐族重复是刻意的：
# SRC_URI 按 LUBANCAT_FAMILY 选文件，不能跨文件 include）。
CONFIG_DISTRO_DEFAULTS=y
CONFIG_CMD_PART=y
CONFIG_CMD_EXT2=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_CMD_IMPORTENV=y
CONFIG_CMD_SOURCE=y
CONFIG_CMD_BOOTI=y
CONFIG_CMD_FDT=y
CONFIG_CMD_DTIMG=y
CONFIG_OF_LIBFDT_OVERLAY=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB_PATH="rk-kernel.dtb"

# DDR lp4 2112 / lp5 2736 v1.09
CONFIG_LOADER_INI="RK3576MINIALL.ini"

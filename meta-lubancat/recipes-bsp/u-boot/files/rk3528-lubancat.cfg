# LubanCat RK3528 的 U-Boot 配置增量
#
# meta-rockchip 没有 rk3528.inc，本层自己拼；U-Boot 侧则是原生的
# configs/rk3528_defconfig + arch/arm/mach-rockchip/rk3528。
CONFIG_DISTRO_DEFAULTS=y
CONFIG_CMD_PART=y
CONFIG_CMD_EXT2=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_CMD_IMPORTENV=y
CONFIG_CMD_SOURCE=y
CONFIG_CMD_BOOTI=y
CONFIG_CMD_FDT=y
CONFIG_CMD_DTIMG=y
CONFIG_OF_LIBFDT_OVERLAY=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB=y
CONFIG_ROCKCHIP_EARLY_DISTRO_DTB_PATH="rk-kernel.dtb"

# DDR 1056MHz v1.11
CONFIG_LOADER_INI="RK3528MINIALL.ini"

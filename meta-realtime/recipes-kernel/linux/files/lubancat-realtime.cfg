# =====================================================================
# meta-realtime：PREEMPT_RT 落地配置
# =====================================================================
# 合并顺序（kernel-yocto 按 SRC_URI 顺序交给 merge_config.sh，后者覆盖前者）：
#   lubancat_linux_rkXXXX_defconfig  →  lubancat-family.cfg  →  本文件
#
# 语法约束（与 family.cfg 同一套）：
#   关项必须写 CONFIG_X=n。merge_config.sh 会把 "# CONFIG_X is not set" 整行当注释删掉，
#   所以 family.cfg 末尾那句 "# CONFIG_WERROR is not set" 从来没生效过（见第 6 节）。
#
# 本文件只写与 RT 相关的项，通用 BSP 项仍在 family.cfg 里，不要复制过来。

# ---- 1) 抢占模型：choice 三选一 ----
# PREEMPT_NONE / PREEMPT_VOLUNTARY / PREEMPT / PREEMPT_RT 互斥，只能有一项 =y。
# PREEMPT_RT depends on EXPERT && ARCH_SUPPORTS_RT；arm64 满足后者，
# 前者由 defconfig 里的 CONFIG_EMBEDDED=y 间接 select（defconfig 中没有 CONFIG_EXPERT 行，
# 不要去那里找）。万一哪天 defconfig 去掉 EMBEDDED，这一行会被 olddefconfig 静默清掉 ——
# 所以验收一律以 .config / /sys/kernel/realtime 为准，不以"我写了"为准。
CONFIG_PREEMPT_RT=y

# ---- 2) 时钟与 tick ----
# RT 分支 defconfig 同时写了 CONFIG_HZ_PERIODIC=y 和 CONFIG_NO_HZ=y：
#   NO_HZ 是被 NO_HZ_IDLE/NO_HZ_FULL select 的隐藏符号，不参与 choice；
#   真正生效的 choice 成员是 HZ_PERIODIC —— 等于把 tickless 关掉了，
#   空闲核每 1ms 被打断一次，抖动的下限被抬高、功耗也上去。
# 两行都写：先把旧 choice 成员关掉，再启用新的。
# 只写 NO_HZ_IDLE=y 的话，olddefconfig 可能保留 .config 里先出现的 HZ_PERIODIC。
CONFIG_HZ_PERIODIC=n
CONFIG_NO_HZ_IDLE=y
CONFIG_HZ_1000=y
CONFIG_HIGH_RES_TIMERS=y

# ---- 3) 调度 ----
# 按 cgroup 给 SCHED_FIFO/SCHED_RR 分时间配额（rt_runtime_us），对硬实时是纯负担。
# 6.1-rt 里这个符号可能因 depends on !PREEMPT_RT 而不可见，写 =n 无害，属显式声明。
# 运行时的 /proc/sys/kernel/sched_rt_runtime_us 保持默认 950000，
# 不要设 -1（那会关掉"RT 线程饿死系统"的保护，一次死循环就锁死整机）。
CONFIG_RT_GROUP_SCHED=n

# ---- 4) RCU：优先级反转的直接来源 ----
# RCU_BOOST 在 PREEMPT_RT 下 default y，仍然显式写：
# 没有它，被抢占的 RCU 读临界区没有优先级继承，普通线程能把 RT 线程卡在
# synchronize_rcu() 上几十毫秒。RCU_EXPERT 是 RCU_BOOST / NOCB 可见的前提
# （defconfig 已有，写一遍防漂移）。
# NOCB 只有在 cmdline 带 rcu_nocbs=<cpu-list> 时才真正把回调挪走。
CONFIG_RCU_EXPERT=y
CONFIG_RCU_BOOST=y
CONFIG_RCU_NOCB_CPU=y

# ---- 5) 调试与锁检测：单这几项就能把最坏延迟推到毫秒级 ----
# lockdep（PROVE_LOCKING）在 RT 下既慢又有一批已知误报；
# DEBUG_ATOMIC_SLEEP 的检查在 RT 里大多被 might_sleep 取代。
# 排查 "sleeping function called from invalid context" 时再临时打开 DEBUG_ATOMIC_SLEEP。
CONFIG_DEBUG_PREEMPT=n
CONFIG_PROVE_LOCKING=n
CONFIG_DEBUG_ATOMIC_SLEEP=n
CONFIG_LOCK_STAT=n
CONFIG_DEBUG_MUTEXES=n
CONFIG_DEBUG_SPINLOCK=n

# ---- 6) 告警即错误 ----
# family.cfg 末尾的 "# CONFIG_WERROR is not set" 是死代码（被当注释删掉），
# 所以非 RT 构建里 WERROR 一直是 y。RT 补丁 + gcc 13 在 BSP 代码上告警面更大，
# 首版先关。这一行才是真正生效的那一行；CI 稳定后删掉即回到 defconfig 的 y。
CONFIG_WERROR=n

# ---- 7) 无线：vendor 树全关，主线 rtw88/rtw89 保留 ----
# 为什么关 vendor：它们依赖已被本层摘除的 0002 补丁（那补丁修的正是 out-of-tree 的
# -I$(src)）。AIC8800 尤其关键 —— RT 分支 defconfig 里它是 =m，而 0002 改过
# aic8800_usb/aic8800_fdrv/Makefile，不关掉 do_compile 必失败。
CONFIG_RTL8189FS=n
CONFIG_RTL8821CU=n
CONFIG_RTL8851BE=n
CONFIG_RTL8852BE=n
CONFIG_AIC_WLAN_SDIO_SUPPORT=n
CONFIG_AIC_WLAN_USB_SUPPORT=n
CONFIG_AIC8800_SDIO_WLAN_SUPPORT=n
CONFIG_AIC8800_SDIO_BTLPM_SUPPORT=n
CONFIG_AIC8800_USB_WLAN_SUPPORT=n
CONFIG_AIC_USB_LOADFW_SUPPORT=n
# WL_ROCKCHIP 必须保留：它 select CFG80211 / MAC80211，而主线 rtw88/rtw89 depends on
# MAC80211。关掉它，rtw89 会被 olddefconfig 静默清空 —— 不报错，只是没了驱动。
CONFIG_WL_ROCKCHIP=y
# 主线 PCIe 卡，RT 下工作良好，与 packagegroup-lubancat-net 的 KERNEL_MODULE_AUTOLOAD 对应：
#   RTL8188CE → rtl8188ee   RTL8822CE → rtw88_8822ce
#   RTL8851BE → rtw89_8851be  RTL8852BE → rtw89_8852be
CONFIG_RTL8188EE=m
CONFIG_RTW88=m
CONFIG_RTW88_8822CE=m
CONFIG_RTW89=m
CONFIG_RTW89_8851BE=m
CONFIG_RTW89_8852BE=m
CONFIG_RTW89_8852AE=m
CONFIG_RTW89_8852CE=m

# ---- 8) 验收要用 ----
# /proc/config.gz。板上没有源码、没有 .config 时，这是唯一能自证 RT 的依据。
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ---- 9) 可选，首版不开 ----
# CONFIG_NO_HZ_FULL=y
#   仅在能同时给 isolcpus / nohz_full / 绑核时开。RK3588S 是 4×A76 + 4×A55，
#   隔离核必须落在同一 cluster；配错的表现是隔离核不再收 tick、但唤醒也上不去。
# CONFIG_SLUB_CPU_PARTIAL=n
#   仅当 cyclictest 高负载用例里看到 mm/slub 相关抖动时再试，常规场景无收益。
# CONFIG_FUNCTION_TRACER=y
#   只在要用 ftrace wakeup_rt 方案测延迟时才开（defconfig 未开）。

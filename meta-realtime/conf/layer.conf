# meta-realtime：把 virtual/kernel 切到 LubanCat 的 PREEMPT_RT 分支
#
# 本层不改 kernel recipe，只覆盖 meta-lubancat 暴露的两个弱赋值变量
#   LUBANCAT_KERNEL_BRANCH / LUBANCAT_KERNEL_SRCREV
# 并追加一份 RT 配置片段。层内的 bbappend 是空操作直到本层被加入 bblayers。

BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "realtime"
BBFILE_PATTERN_realtime = "^${LAYERDIR}/"

# 必须高于 lubancat(10)。bbappend 按层优先级**从低到高**应用，高优先级后写、后生效；
# 本层要同时做到两件事：
#   (a) 用 = 覆盖 LUBANCAT_KERNEL_*（低优先级层里是 ?=，谁后写谁赢）；
#   (b) 让 SRC_URI += 的 lubancat-realtime.cfg 排在 family.cfg 之后 ——
#       kernel-yocto 按 SRC_URI 顺序交给 merge_config.sh，最后一份生效。
# 同优先级下顺序不保证，所以显式给 15，也给以后别的 overlay 留出空档。
BBFILE_PRIORITY_realtime = "15"

# 与 git tag 的 MAJOR.MINOR 保持一致
LAYERVERSION_realtime = "0.1"

# 只依赖真正需要的两层：core 提供 kernel.bbclass / linux-yocto.inc，
# lubancat 提供被 append 的 recipe 与那两个变量（它自己已经依赖 rockchip）。
# 不列 rockchip：lubancat 已传递依赖；重复列只会在层缺失时把警告变成 parse error。
LAYERDEPENDS_realtime = "core lubancat"

LAYERSERIES_COMPAT_realtime = "scarthgap"
